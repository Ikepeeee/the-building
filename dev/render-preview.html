<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Render Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; right: 6px; top: 6px; color: #fff; font: 11px/1.4 ui-monospace, monospace; background: rgba(0,0,0,.55); padding: 4px 6px; border-radius: 4px; pointer-events: none; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
// 使い方: ?hour=12&zoom=2&f=5&x=40&people=200&speed=1&ghost=1&sel=1&real=1&hud=0
import { Renderer } from '../js/render/renderer.js';
import { TILE_W, FLOOR_H } from '../js/sim/constants.js';
import { MockTower } from './mock-sim.js';

const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? parseFloat(q.get(k)) : d);
const hour = q.has('hour') ? num('hour', 12) : null;
let sim;
if (q.get('real') === '1') {
  const { Tower } = await import('../js/sim/tower.js');
  sim = new Tower({ seed: 7 });
  if (q.get('scene') === 'demo') {
    sim.money = 1e9; sim.star = 5;
    const fails = [];
    const B = (tool, p) => { const r = sim.build(tool, p); if (!r || !r.ok) fails.push(tool + JSON.stringify(p) + ':' + (r && r.reason)); return r; };
    B('lobby', { f: 0, x: 30, x2: 119 });
    for (let f = 1; f <= 16; f++) B('floor', { f, x: 30, x2: 119 });
    for (let f = -1; f >= -4; f--) B('floor', { f, x: 30, x2: 119 });
    B('elevator', { f: 0, x: 66, f2: 16 }); B('elevator', { f: -4, x: 70, f2: 12 });
    B('express', { f: -3, x: 74, f2: 14 });
    B('stairs', { f: 0, x: 32 }); B('escalator', { f: 0, x: 100 }); B('stairs', { f: 1, x: 32 });
    for (const [t, f, x] of [['fastfood', 1, 40], ['shop', 1, 80], ['restaurant', 1, 92]]) B(t, { f, x });
    B('cinema', { f: 2, x: 34 }); B('partyHall', { f: 2, x: 80 });
    B('security', { f: 4, x: 30 }); B('housekeeping', { f: 4, x: 46 }); B('medical', { f: 4, x: 80 });
    for (let f = 5; f <= 8; f++) { for (let i = 0; i < 4; i++) B('office', { f, x: 30 + i * 10 }); for (let i = 0; i < 3; i++) B('office', { f, x: 80 + i * 10 }); }
    for (let f = 9; f <= 11; f++) { B('condo', { f, x: 30 }); B('condo', { f, x: 46 }); B('condo', { f, x: 80 }); }
    for (let f = 12; f <= 13; f++) { for (let i = 0; i < 6; i++) B('hotelSingle', { f, x: 30 + i * 4 }); for (let i = 0; i < 4; i++) B('hotelTwin', { f, x: 80 + i * 6 }); }
    B('hotelSuite', { f: 14, x: 30 }); B('hotelSuite', { f: 14, x: 80 });
    B('metro', { f: -4, x: 32 });
    B('garbage', { f: -2, x: 96 }); B('parking', { f: -1, x: 32 }); B('parking', { f: -1, x: 56 });
    window.__fails = fails;
  }
  if (q.has('steps')) for (let i = 0; i < +q.get('steps'); i++) sim.step(1);
  // 実 sim で事件を起こす（確認用）: ev=bomb|fire, evSteps=分
  if (q.get('ev') === 'bomb' && sim.plantBomb) { sim.plantBomb(num('bf', 7), num('bx', 45)); sim.explodeBomb(); }
  if (q.get('ev') === 'fire' && sim.startFire) {
    const o = sim.objAt(num('bf', 7), num('bx', 45));
    if (o && sim.startFire(o)) { sim._answer_fire && sim._answer_fire('heli'); }
  }
  if (q.has('evSteps')) for (let i = 0; i < +q.get('evSteps'); i++) sim.step(0.5);
} else {
  sim = new MockTower({ hour, people: num('people', 160), bombFound: q.get('bombFound') === '1', santa: q.get('santa') !== '0', santaF: q.has('santaF') ? +q.get('santaF') : undefined, heli: q.get('heli') === '1', big: q.get('big') === '1', floors: num('floors', 60), truck: q.get('truck') || null, heliT: num('heliT', 0), bomb: q.get('bomb') !== '0' });
}
window.sim = sim;
const canvas = document.getElementById('c');
const r = new Renderer(canvas, sim);
if (q.get('nocache') === '1') r.opts.cache = false;
if (q.get('nolod') === '1') r.opts.lod = false;
if (q.get('nocaps') === '1') r.opts.caps = false;
window.renderer = r;
const cam = { x: 0, y: 0, zoom: num('zoom', 2) };
function center(f, x) {
  cam.x = x * TILE_W - innerWidth / cam.zoom / 2;
  cam.y = -(f + 0.5) * FLOOR_H - innerHeight / cam.zoom / 2;
}
center(num('f', 3), num('x', 70));
function size() { r.resize(innerWidth, innerHeight); }
addEventListener('resize', size); size();

const view = { cam, ghost: null, selectedId: null, hover: null, nowMs: 0 };
if (q.get('simplify') === '1') view.simplifyPeople = true;
if (q.get('ghost') === '1') {
  view.ghost = { x: 30, w: 9, f: 21, h: 1, ok: true, label: 'オフィス $40,000', type: 'office' };
}
if (q.get('ghost') === '2') view.ghost = { x: 100, w: 16, f: 6, h: 1, ok: false, label: 'ここには建てられません' };
if (q.get('ghost') === '3') view.ghost = { x: 50, w: 4, lo: 2, hi: 12, ok: true, label: 'エレベーター 2F〜13F' };
if (q.get('ghosts') === '1') view.ghosts = [
  { x: 150, w: 9, f: 13, h: 1, ok: true, type: 'office', label: 'コピー 3件 $480,000' }, { x: 159, w: 16, f: 13, h: 1, ok: true, type: 'condo' },
  { x: 175, w: 4, lo: 13, hi: 16, ok: true }, { x: 179, w: 12, f: 13, h: 1, ok: false, type: 'shop' }];
if (q.get('overlay')) view.overlay = q.get('overlay');
if (q.get('marked') === '1') { view.marked = new Set(); let k = 0; for (const o of sim.objs.values()) { if (o.f >= 5 && o.f <= 7 && o.x >= 30 && o.x < 70 && k < 6) { view.marked.add(o.id); k++; } } }
if (q.has('selp')) {
  const want = q.get('selp');
  const pool = [...sim.active].filter((p) => (want === 'ride' ? p.state === 'ride' : want === 'wait' ? p.state === 'wait' : p.state === 'walk' && p.f >= 0 && p.f <= 3));
  view.selectedPerson = pool[(pool.length / 2) | 0] || null;
}
if (q.get('sel') === '1') { const o = sim.objAt ? sim.objAt(1, 20) : null; if (o) view.selectedId = o.id; }
if (q.has('hx')) view.hover = { f: num('hf', 0), x: num('hx', 0) };

// 操作（ドラッグでパン・ホイールでズーム）
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (drag) { cam.x = drag.cx - (e.clientX - drag.x) / cam.zoom; cam.y = drag.cy - (e.clientY - drag.y) / cam.zoom; }
  const wx = e.clientX / cam.zoom + cam.x, wy = e.clientY / cam.zoom + cam.y;
  view.hover = { x: Math.floor(wx / TILE_W), f: Math.floor(-wy / FLOOR_H) };
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const wx = e.clientX / cam.zoom + cam.x, wy = e.clientY / cam.zoom + cam.y;
  cam.zoom = Math.max(0.25, Math.min(6, cam.zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
  cam.x = wx - e.clientX / cam.zoom; cam.y = wy - e.clientY / cam.zoom;
}, { passive: false });
addEventListener('keydown', (e) => {
  if (e.key === 'n' && sim.hourFixed != null) sim.hourFixed = (sim.hourFixed + 1) % 24;
});

const hud = document.getElementById('hud');
if (q.get('hud') === '0') hud.style.display = 'none';
const speed = num('speed', 1);
if (q.has('bench')) {
  const N = +q.get('bench');
  for (let i = 0; i < 5; i++) { sim.step(0.1); view.nowMs = i * 16; r.render(view); }
  let tot = 0;
  for (let i = 0; i < N; i++) { sim.step(0.1); view.nowMs = 100 + i * 16; const a = performance.now(); r.render(view); if (q.get('nosync') !== '1') r.ctx.getImageData(0, 0, 1, 1); tot += performance.now() - a; }
  const avg = tot / N;
  document.title = 'BENCH ' + avg.toFixed(2);
  hud.style.fontSize = '20px';
  window.__bench = `bench avg ${avg.toFixed(2)}ms/frame (render) people=${r.stats.people} objs=${r.stats.objs}`;
}
let last = performance.now(), fps = 0, acc = 0, frames = 0;
// ---- 事件のストレステスト: ?big=1&stress=1&dur=120（秒）。結果は window.__stress ----
const stress = q.get('stress') === '1' ? { t0: performance.now(), dur: num('dur', 120) * 1000, samples: [], acc: [], last: performance.now(), lastSample: performance.now(), nextEv: 0 } : null;
const allObjs = stress ? [...sim.objs.values()].filter((o) => o.type !== 'elevator' && o.type !== 'express') : [];
const rnd = () => Math.random();
const pickO = () => allObjs[(rnd() * allObjs.length) | 0];
function stressTick(now) {
  const T = sim.time;
  // 毎フレーム: 200 室の在室人数と 300 室の焼け具合を変える（チャンクの描き直しを誘発）
  for (let i = 0; i < 200; i++) { const o = pickO(); o.inCount = (rnd() * 8) | 0; }
  for (let i = 0; i < 300; i++) { const o = pickO(); o.burnt = rnd(); }
  if (now > stress.nextEv) {
    stress.nextEv = now + 400;
    const kinds = ['explosion', 'smoke', 'fireworks', 'confetti', 'bells', 'sparkle'];
    for (let i = 0; i < 8; i++) sim.effects.push({ kind: kinds[(rnd() * kinds.length) | 0], f: (rnd() * 60) | 0, x: (rnd() * 470) | 0, t0: T, dur: 30 + rnd() * 200 });
    // 期限切れの効果は sim と同じく取り除く
    sim.effects = sim.effects.filter((e) => e._loop || T - e.t0 < e.dur);
    sim.fires = [];
    for (let i = 0; i < 40; i++) { const x0 = (rnd() * 470) | 0; sim.fires.push({ f: (rnd() * 60) | 0, x0, x1: x0 + 2 + ((rnd() * 60) | 0) }); }
    for (let i = 0; i < 20; i++) { const o = pickO(); o.destroyed = rnd() < 0.5 ? (rnd() < 0.5 ? 'bomb' : 'fire') : undefined; }
    for (let i = 0; i < 30; i++) { const o = pickO(); o.constructStart = T - rnd() * 100; o.constructUntil = T + rnd() * 100; }
    for (let i = 0; i < 20; i++) { const o = pickO(); o.infested = rnd() < 0.5; o.dirty = rnd() < 0.5; o.complaintUntil = T + 60; }
    sim.heli = { phase: 'spray', x: 100 + rnd() * 200, f: 30, targetX: 150, targetF: 25 };
    sim.bomb = { f: 20, x: 100, deadline: T + 100, searched: new Set(Array.from({ length: (rnd() * 60) | 0 }, (_, i) => i)), found: rnd() < 0.3 };
  }
  // カメラを動かし、ズームも変える（チャンクの解像度が切り替わる）
  const k = (now - stress.t0) / 1000;
  cam.zoom = [0.25, 0.5, 1, 2][((k / 7) | 0) % 4];
  center(30 + Math.sin(k / 5) * 25, 240 + Math.sin(k / 3) * 200);
}
function stressSample(now, ms) {
  stress.acc.push(ms);
  if (now - stress.lastSample >= 1000) {
    const a = stress.acc; const avg = a.reduce((x, y) => x + y, 0) / a.length; const max = Math.max(...a);
    const mem = r.memoryEstimate ? r.memoryEstimate() : {};
    stress.samples.push({ t: Math.round((now - stress.t0) / 1000), fps: a.length, avg: +avg.toFixed(2), max: +max.toFixed(1), heapMB: performance.memory ? +(performance.memory.usedJSHeapSize / 1048576).toFixed(1) : null, ...mem, effects: sim.effects.length });
    stress.acc = []; stress.lastSample = now;
  }
  if (now - stress.t0 > stress.dur && !window.__stress) window.__stress = JSON.stringify(stress.samples);
}
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (speed > 0) sim.step(dt * 6 * speed);
  view.nowMs = now;
  if (stress) stressTick(now);
  const rt0 = performance.now();
  r.render(view);
  if (stress) stressSample(now, performance.now() - rt0);
  frames++; acc += dt;
  if (acc > 0.5) { fps = frames / acc; frames = 0; acc = 0; }
  hud.textContent = (window.__bench ? window.__bench + '\n' : '') + (window.__fails && window.__fails.length ? 'FAIL ' + window.__fails.slice(0, 6).join('\n') + '\n' : '') + `fps ${fps.toFixed(0)}  draw ${r.stats.ms.toFixed(1)}ms\nobjs ${r.stats.objs}  people ${r.stats.people}\n${sim.hour}:${String(sim.minute).padStart(2, '0')} zoom ${cam.zoom.toFixed(2)}` + (r.lastError ? '\nERR ' + (r.lastError.stack || r.lastError) : '');
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
